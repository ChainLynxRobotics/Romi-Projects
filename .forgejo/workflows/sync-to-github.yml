# Forgejo -> GitHub half of the two-way sync. (GitHub ignores the .forgejo/ directory.)
# Fast-forward only: a diverged branch makes this job fail instead of overwriting anything.
# How it works, and how to fix a red run: see scripts/git-sync.sh.
#
# Needs one repo secret on Forgejo (Settings -> Actions -> Secrets):
#   GH_SYNC_TOKEN  GitHub fine-grained PAT for ChainLynxRobotics/Romi-Projects with
#                  Contents: read/write and Workflows: read/write
#                  (Workflows is needed so changes under .github/workflows/ can be pushed).
name: Sync to GitHub

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:   # manual full catch-up: pushes every branch and tag

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone this repo (bare)
        env:
          SRC_TOKEN: ${{ github.token }}
        run: |
          set -eu
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git; }
          t="${RUNNER_TEMP:-/tmp}"
          printf '#!/bin/sh\nprintf %%s "$SRC_TOKEN"\n' > "$t/askpass-src"; chmod +x "$t/askpass-src"
          GIT_ASKPASS="$t/askpass-src" GIT_TERMINAL_PROMPT=0 \
            git clone --bare --quiet "https://x@git.emeraldcityrobotics.org/${{ github.repository }}.git" "$t/repo.git"
          git --git-dir="$t/repo.git" show HEAD:scripts/git-sync.sh > "$t/git-sync.sh"

      - name: Push to GitHub (fast-forward only)
        env:
          DST_URL: https://x@github.com/ChainLynxRobotics/Romi-Projects.git
          DST_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEL_REF: ${{ github.event.ref }}
          DEL_TYPE: ${{ github.event.ref_type }}
          ON_DELETE: safe
        run: |
          set -eu
          t="${RUNNER_TEMP:-/tmp}"
          REPO_DIR="$t/repo.git" bash "$t/git-sync.sh"
